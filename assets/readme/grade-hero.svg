      <text x="49" y="219" font-family="Georgia, 'Times New Roman', serif" font-size="164" letter-spacing="-6">GRADE<tspan fill="#D5B46E">.</tspan></text>
      <text x="56" y="280" font-size="38" font-weight="400">From sequences to</text>
      <text x="56" y="326" font-size="38" font-weight="400">experimental priorities.</text>
    </g>
