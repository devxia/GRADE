<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
  <title id="title">GRADE — from sequences to experimental priorities</title>
  <desc id="desc">GRADE ranks candidate peptide agonists for a GPCR target. A GPCR amino acid sequence and candidate peptides enter GRADE-paper; candidates are returned in descending score order for experimental prioritization. The seven-transmembrane receptor and peptide chain are schematic, not a molecular structure or experimental results.</desc>
