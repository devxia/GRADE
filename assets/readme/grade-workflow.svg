<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">GRADE: GPCR-targeted peptide ranking</title>
  <desc id="desc">A GPCR amino acid sequence and a list of candidate peptides are supplied to GRADE-paper. The model scores candidates for predicted agonist activity and returns them in descending score order. The peptide labels, sequence fragments and ranking shown are schematic, not prediction results. Functional assays are needed to establish agonist activity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#16685C" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="640" rx="20" fill="#F8FAF9"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#18332F">
    <g id="heading">
      <text x="56" y="78" font-size="44" font-weight="650" letter-spacing="-1">GPCR-targeted peptide ranking</text>
      <path d="M 56 109 H 1144" stroke="#D8E1DD" stroke-width="1.5"/>
    </g>

    <g id="target-input">
      <rect x="56" y="148" width="332" height="152" rx="12" fill="#FFFFFF" stroke="#D8E1DD" stroke-width="1.5"/>
      <text x="80" y="192" font-size="36" font-weight="600">GPCR sequence</text>
      <g transform="translate(80 218)" fill="#16685C">
        <rect x="0" y="5" width="7" height="27" rx="3.5"/>
        <rect x="12" y="0" width="7" height="32" rx="3.5"/>
        <rect x="24" y="5" width="7" height="27" rx="3.5"/>
        <rect x="36" y="0" width="7" height="32" rx="3.5"/>
        <rect x="48" y="5" width="7" height="27" rx="3.5"/>
        <rect x="60" y="0" width="7" height="32" rx="3.5"/>
        <rect x="72" y="5" width="7" height="27" rx="3.5"/>
      </g>
      <text x="177" y="245" font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="23" fill="#637570">MDYQVS…</text>
      <text x="80" y="277" font-size="21" fill="#637570">One target sequence</text>
    </g>

    <g id="peptide-input">
      <rect x="56" y="326" width="332" height="220" rx="12" fill="#FFFFFF" stroke="#D8E1DD" stroke-width="1.5"/>
      <text x="80" y="370" font-size="36" font-weight="600">Peptide list</text>
      <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="26">
        <text x="80" y="415" fill="#18332F">P1</text>
        <text x="80" y="461" fill="#18332F">P2</text>
        <text x="80" y="507" fill="#18332F">P3</text>
        <text x="141" y="415" fill="#637570">ACDEFG…</text>
        <text x="141" y="461" fill="#637570">YTVSRQ…</text>
        <text x="141" y="507" fill="#637570">KLMNPQ…</text>
      </g>
      <path d="M 124 391 V 515" stroke="#E3EEEA" stroke-width="2"/>
    </g>

    <g id="combined-input-flow" fill="none" stroke="#16685C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 388 224 H 413 Q 431 224 431 242 V 329"/>
      <path d="M 388 436 H 413 Q 431 436 431 418 V 329 H 474" marker-end="url(#arrow)"/>
      <circle cx="431" cy="329" r="5" fill="#16685C" stroke="none"/>
    </g>

    <g id="grade-scoring">
      <rect x="478" y="220" width="252" height="218" rx="16" fill="#E3EEEA" stroke="#16685C" stroke-width="2"/>
      <text x="604" y="269" text-anchor="middle" font-size="22" font-weight="500" fill="#16685C">GRADE-paper</text>
      <text x="604" y="326" text-anchor="middle" font-size="46" font-weight="700" letter-spacing="-1">GRADE</text>
      <path d="M 512 347 H 696" stroke="#BED3C9" stroke-width="1.5"/>
      <text x="604" y="384" text-anchor="middle" font-size="32" font-weight="500">Agonist scoring</text>
      <text x="604" y="416" text-anchor="middle" font-size="21" fill="#637570">Target-specific</text>
    </g>

    <g id="ranking-flow" fill="none" stroke="#16685C" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 730 329 H 818" marker-end="url(#arrow)"/>
    </g>

    <g id="ranked-output">
      <text x="840" y="192" font-size="36" font-weight="600">Ranked peptides</text>
      <text x="840" y="226" font-size="22" fill="#637570">Higher score first</text>
      <path d="M 840 249 H 1144" stroke="#D8E1DD" stroke-width="1.5"/>
      <g font-family="ui-monospace, 'SFMono-Regular', Menlo, monospace" font-size="27">
        <text x="840" y="300" fill="#637570">1</text>
        <text x="887" y="300" font-weight="600">P2</text>
        <text x="840" y="380" fill="#637570">2</text>
        <text x="887" y="380" font-weight="600">P1</text>
        <text x="840" y="460" fill="#637570">3</text>
        <text x="887" y="460" font-weight="600">P3</text>
      </g>
      <rect x="945" y="279" width="199" height="25" rx="4" fill="#16685C"/>
      <rect x="945" y="359" width="138" height="25" rx="4" fill="#5E9184"/>
      <rect x="945" y="439" width="77" height="25" rx="4" fill="#94B7AA"/>
      <text x="840" y="523" font-size="22" fill="#637570">Illustrative ranking</text>
    </g>

    <g id="experimental-boundary">
      <path d="M 56 573 H 1144" stroke="#D8E1DD" stroke-width="1.5"/>
      <text x="56" y="611" font-size="23" fill="#637570">Predictions prioritize experiments. Functional assays establish agonist activity.</text>
    </g>
  </g>
</svg>
